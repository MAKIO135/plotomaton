<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>Plot-o-matic</title>
    
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />
</head>
<body>
    <div id="cvsContainer"></div>
    <div id="rightCol">
        <h1>Plotomaton</h1>

        <div id="inputContainer" class="rangeContainer small-padding-top">
            <label for="threshold" class="centered">Set threshold</label>
            <input 
                type="range" 
                id="threshold" 
                name="threshold" 
                min="0.1" 
                max="1"
                value="0.5"
                step=".02"
            />
            <p id="thresholdValue" class="light-dark centered">0</p>
        </div>

        <div class="small-padding">
            <label for="format" class="centered">Paper format</label>
            <select id="formats" name="formats">
                <option value="A6">A6</option>
                <option value="A5">A5</option>
                <option value="A4">A4</option>
                <option value="A3">A3</option>
            </select> 
        </div>
       

        <div id="orientation" class="small-padding">
            <p>Orientation</p>
            <input type="radio" id="PORTRAIT" name="orientation" value="PORTRAIT" checked>
            <label for="PORTRAIT">Portrait</label><br>
            <input type="radio" id="LANDSCAPE" name="orientation" value="LANDSCAPE">
            <label for="LANDSCAPE">Landscape</label><br>
        </div>

        <button id="SendToPrinter">Print</button>
        <button id="ResendToPrinter">Print last job</button>
